[project]
name = "assistant"
version = "0.1.0"
requires-python = "==3.14.4"
dependencies = [
    "aio-pika",
    "langchain",
    "langgraph",
    "psycopg[binary]",
    "sqlalchemy[asyncio]",
]

[build-system]
requires = ["uv_build==0.11.29"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "assistant"
namespace = true
