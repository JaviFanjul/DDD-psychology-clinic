[tool.uv]
constraint-dependencies = [
    "aio-pika==10.2.2",
    "aiosmtplib==5.1.3",
    "fastapi==0.162.0",
    "langchain==1.4.9",
    "langgraph==1.2.20",
    "psycopg==3.3.6",
    "sqlalchemy==2.1.6",
]

[tool.uv.workspace]
members = ["pkg/*", "ci/scripts"]

[dependency-groups]
dev = [
    "import-linter==2.15",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.3",
    "testcontainers[mailpit,rabbitmq]==4.15.0",
]

[tool.mypy]
strict = true
mypy_path = "pkg/core/src:pkg/assistant/src:ci/scripts/src"
files = ["pkg/core/src", "pkg/assistant/src", "ci/scripts/src"]
namespace_packages = true
explicit_package_bases = true

[tool.importlinter]
root_packages = ["core", "assistant"]

[[tool.importlinter.contracts]]
name = "Core hexagonal layers"
type = "layers"
containers = ["core"]
layers = [
    "entrypoint | infrastructure",
    "application",
    "domain",
]

[[tool.importlinter.contracts]]
name = "Assistant hexagonal layers"
type = "layers"
containers = ["assistant"]
layers = [
    "entrypoint | infrastructure",
    "application",
    "domain",
]

[[tool.importlinter.contracts]]
name = "Independent bounded contexts"
type = "independence"
modules = ["core", "assistant"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
consider_namespace_packages = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
