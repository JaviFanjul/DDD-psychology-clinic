[tool.uv]
constraint-dependencies = [
    "fastapi==0.162.0",
    "psycopg==3.3.6",
    "sqlalchemy==2.1.6",
]

[tool.uv.workspace]
members = ["pkg/*", "ci/scripts"]

[dependency-groups]
dev = [
    "import-linter==2.15",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.3",
    "testcontainers==4.15.0",
]

[tool.mypy]
strict = true
mypy_path = "pkg/core/src:ci/scripts/src"
files = ["pkg/core/src", "ci/scripts/src"]
namespace_packages = true
explicit_package_bases = true

[tool.importlinter]
root_package = "core"

[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
containers = ["core"]
layers = [
    "entrypoint | infrastructure",
    "application",
    "domain",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
